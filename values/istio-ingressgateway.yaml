# istio-ingressgateway 1.30.1
#
# The Helm release MUST be named "istio-ingressgateway" so the chart renders
# labels app=istio-ingressgateway / istio=ingressgateway. Kubeflow's Gateway
# (common/istio/kubeflow-istio-resources) selects on istio=ingressgateway.
#
# REQUIRED. Every Kubeflow app carries an AuthorizationPolicy that allows only
# the mTLS principal:
#   cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account
# The Helm gateway chart otherwise names the ServiceAccount after the release
# ("istio-ingressgateway"), so the principal never matches and every Kubeflow
# UI returns "RBAC: access denied" even after a successful login.
serviceAccount:
  create: true
  name: istio-ingressgateway-service-account

# NodePort was chosen because this cluster has no LoadBalancer provider.
service:
  type: NodePort
  ports:
    - name: status-port
      port: 15021
      targetPort: 15021
    - name: http2
      port: 80
      targetPort: 80
      nodePort: 31380
    - name: https
      port: 443
      targetPort: 443
      nodePort: 31390

replicaCount: 1
autoscaling:
  enabled: false

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits:   { memory: 512Mi }
